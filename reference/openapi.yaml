      summary: Get SEO Report
      operationId: getSEOReport
      description: >-
        Returns a single SEO Report by UUID.


        With **Data API** access the response includes the full report payload —
        scores, timings, per-check results and keyword data — as shown in the
        example below.
      tags:
        - SEO Reports
      parameters:
        - name: uuid
          in: path
          description: UUID of the Website Report to retrieve
          required: true
          example: 1779d0d3e381abf98f1d504fc3d0b140b07ff697
          schema:
            type: string
  /api/reports:
    post:
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: report-request
                      attributes:
                        $ref: '#/components/schemas/ReportRequest'
              example:
                data:
                  type: report-request
                  attributes:
                    state: starting
                    title: Report accepted for processing.
                    percent-complete: 0
        '202':
          description: Accepted
          headers:
            Content-Location:
              schema:
                type: string
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: report-request
                      id:
                        type: string
                        example: 70308c62a84c3359d13563ddb10486c3af694bad
                      attributes:
                        $ref: '#/components/schemas/ReportRequest'
              example:
                data:
                  type: report-request
                  id: 70308c62a84c3359d13563ddb10486c3af694bad
                  attributes:
                    state: starting
                    title: Report accepted for processing.
                    percent-complete: 0
        '400':
          description: Bad Request
          headers: {}
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorPost'
              example:
                errors:
                  - code: 1023
                    title: Invalid Email
                    detail: The 'email' parameter is empty or invalid.
                    source:
                      pointer: /data/attributes/email
      summary: Create SEO Report
      operationId: createSEOReport
      description: >-
        Sending a POST request to create a new SEO Report will yield one of two
        different objects:

        * If the request will CREATE a new SEO Report, or will REFRESH an
        existent SEO Report, it returns a `202 Accepted` status code and
        creates a new "SEO Report Request" (returned in the body payload
        and in the `Content-Location` header). You are required to **poll**
        the endpoint returned in the `Content-Location` header regularly
        until the Report is created.

        (See "Get SEO Report Request Status")

        * If the request is for a cached domain and **will not** create a
        new SEO Report request, it returns a `201 Created` response with
        the SEO Report as payload.
      tags:
        - SEO Reports
      requestBody:
        content:
          application/vnd.marketgoo.api+json:
            example:
              data:
                type: website-report
                attributes:
                  domain: www.marketgoo.com
                  email: john@doe.com
                  country: us
                  promo: xmas-promo
            schema:
              type: object
              properties:
                data:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      example: website-report
                      description: Required json:api item type. Always `website-report`.
                    attributes:
                      $ref: '#/components/schemas/ReportPostParameters'
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportRequestJson'
                  meta:
                    $ref: '#/components/schemas/Meta'
                  links:
                    $ref: '#/components/schemas/LinksReports'
              example:
                data:
                  - type: report-request
                    id: b7e1b8f8b6290abd2c284941f7f488764a36cf93
                    attributes:
                      type: website-report
                      uuid: 1779d0d3e381abf98f1d504fc3d0b140b07ff697
                      domain: www.marketgoo.com
                      cached_until: '2018-04-12T16:12:07Z'
                      created_at: '2018-03-28T16:12:07Z'
                      finished_at: '2018-03-28T16:50:42Z'
                      country: us
                      status: 100
                      pages: 50
                      home_title: marketgoo - Easy SEO Tools for Small Businesses
                      home_description: >-
                        Improve your SEO, increase your website traffic and
                        rankings with our easy SEO tools ideal for Small
                        Businesses. 10 day free trial!
                      thumbnail: fb8a42eaaad1eaf41f73e3643140e8f87a15f057.png
                meta:
                  total_items: 1
                  total_pages: 1
                links:
                  first: >-
                    https://app.acmeseo.com/api/reports?page%5Blimit%5D=10&page%5Boffset%5D=0
                  last: >-
                    https://app.acmeseo.com/api/reports?page%5Blimit%5D=10&page%5Boffset%5D=0
                  next: null
                  prev: null
      summary: Get multiple SEO Reports
      operationId: getMultipleSEOReports
      description: ''
      tags:
        - SEO Reports
      parameters:
        - name: page[limit]
          in: query
          required: false
          description: Number of reports to retrieve in each page.
          schema:
            type: integer
            default: 100
          example: 10
        - name: page[offset]
          in: query
          required: false
          description: Start listing reports at this item offset (zero based).
          schema:
            type: integer
            default: 0
          example: 0
        - name: filter[type]
          in: query
          required: false
          description: Retrieve only reports matching this type.
          schema:
            type: string
            default: website-report
            enum:
              - website-report
          example: website-report
        - name: filter[promo]
          in: query
          required: false
          description: Retrieve only reports matching this promo tag.
          schema:
            type: string
