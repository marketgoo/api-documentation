      summary: Get Single Sign On link
      operationId: getSingleSignOnLink
      description: >-
        Returns a Single Sign On link for the account. By default the link is
        permanent. Provide the `expires` query parameter (in minutes) to obtain
        an expiring link instead.
      tags:
        - Single Sign On
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of the Account to get a SSO link for.
          schema:
            type: string
          example: 1cbd65c81e6462906c8f4eaf02417d3cae667ffb
        - name: expires
          in: query
          required: false
          description: >-
            Number of minutes the link will be valid (between 5 and 1,440). When
            supplied, an expiring SSO link is returned instead of a permanent
            one.
          schema:
            type: integer
            minimum: 5
            maximum: 1440
          example: 60
