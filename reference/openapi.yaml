    AccountBase:
      type: object
      properties:
        uuid:
          type: string
          example: 1cbd65c81e6462906c8f4eaf02417d3cae667ffb
          description: The unique resource identifier for this Account
        promo:
          type: string
          example: xmas-promo
          description: The Promo
          nullable: true
        created_at:
          type: string
          example: '2017-09-28T00:22:38Z'
          description: Account creation date / time
        deleted_at:
          type: string
          description: The date / time on which this Account was deleted
          nullable: true
        suspended_at:
          type: string
          description: The date / time on which this Account was suspended
          nullable: true
        delete_date:
          type: string
          description: >-
            Account is still **active** but **marked for deletion** at this date
            / time.
          nullable: true
        trial_period:
          type: number
          example: 10
          description: Number of trial days
        is_configured:
          type: boolean
          description: >-
            This is a `boolean` field that flags active user interaction of the
            tool. If this field is `true`, the user has passed and configured
            the initial Wizard, marking the active usage of the product.
        product:
          type: string
          example: evolution
          description: Type of product
        domain:
          type: string
          example: www.marketgoo.com
          description: The domain for this Account web site
        name:
          type: string
          example: John Doe
          description: The name of the user
        email:
          type: string
          example: john@doe.com
          description: The email of the user
        lang:
          type: string
          example: en
          description: The language of the user
        site:
          $ref: '#/components/schemas/SiteBase'
      additionalProperties: true
    SiteBase:
      type: object
      properties:
        domain:
          type: string
          example: www.marketgoo.com
          description: The domain for this site
        created_at:
          type: string
          example: '2017-09-26T14:20:36Z'
          description: Site creation date / time (UTC)
        checked_at:
          type: string
          example: '2017-10-02T14:20:41Z'
          description: Date / time of the last automattic scan
        thumbnail:
          type: string
          example: fb8a42eaaad1eaf41f73e3643140e8f87a15f057.png
          description: >-
            Thumbnail filename. Use the following table to prefix this filename
            and get the correct thumbnail size and type:

            | Type    | Size                  | Prefix path                     |
            |---------|-----------------------|---------------------------------|
            | Desktop | Medium (400x300)      | /thumbnails/desktop/medium      |
            | Desktop | Small (200x150)       | /thumbnails/desktop/small       |
            | Desktop | Thumbnail (100x75)    | /thumbnails/desktop/thumbnail   |
            | Mobile  | Medium (320x568)      | /thumbnails/mobile/medium       |
            | Mobile  | Small (160x284)       | /thumbnails/mobile/small        |
            | Mobile  | Thumbnail (80x142)    | /thumbnails/mobile/thumbnail    |
            | Tablet  | Medium (400x300)      | /thumbnails/tablet/medium       |
            | Tablet  | Small (200x150)       | /thumbnails/tablet/small        |
            | Tablet  | Thumbnail (100x75)    | /thumbnails/tablet/thumbnail    |

            Add this thumbnail filename to the prefix path to create the final
            URL path to the desired thumbnail type and size. For example:

            `https://app.acmeseo.com/thumbnails/desktop/medium/fb8a42eaaad1eaf41f73e3643140e8f87a15f057.png`
      additionalProperties: true
    AccountJson:
      type: object
      properties:
        id:
          type: string
          example: 1cbd65c81e6462906c8f4eaf02417d3cae667ffb
          description: |-
            The unique ID for the Account. This `id` is the same value
            returned in the `uuid` field of the Account object attributes.
        type:
          type: string
          example: account
          description: Defines the type of the object returned in `attributes`.
        attributes:
          $ref: '#/components/schemas/AccountBase'
    ReportBase:
      type: object
      properties:
        type:
          type: string
          example: website-report
        uuid:
          type: string
          example: 1779d0d3e381abf98f1d504fc3d0b140b07ff697
        domain:
          type: string
          example: www.marketgoo.com
        cached_until:
          type: string
          example: '2018-04-12T16:12:07Z'
        created_at:
          type: string
          example: '2018-03-28T16:12:07Z'
        finished_at:
          type: string
          example: '2018-03-28T16:50:42Z'
        country:
          type: string
          example: us
        status:
          type: integer
          example: 100
        pages:
          type: integer
          example: 50
        home_title:
          type: string
          example: marketgoo - Easy SEO Tools for Small Businesses
        home_description:
          type: string
          example: >-
            Improve your SEO, increase your website traffic and rankings with
            our easy SEO tools ideal for Small Businesses. 10 day free trial!
        thumbnail:
          type: string
          example: fb8a42eaaad1eaf41f73e3643140e8f87a15f057.png
      additionalProperties: true
    ReportRequestJson:
      type: object
      properties:
        type:
          type: string
          example: report-request
        id:
          type: string
          example: b7e1b8f8b6290abd2c284941f7f488764a36cf93
        attributes:
          $ref: '#/components/schemas/ReportBase'
    AccountPostParameters:
      type: object
      required:
        - domain
        - product
        - name
        - email
      properties:
        domain:
          type: string
          example: www.marketgoo.com
          description: The domain of the web site
        product:
          type: string
          example: evolution
          description: The product to use for the new account
        name:
          type: string
          example: John Doe
          description: The name of the user
        email:
          type: string
          example: john@doe.com
          description: The email of the user
        lang:
          type: string
          example: en
          description: >-
            The desired language for the account. It is the `ISO 639-1` language
            code and currently it is limited to the following available languages:

            | ISO 639-1 | Language           |
            |:----------|:-------------------|
            |    en     | English (American) |
            |    gb     | English (British)  |
            |    de     | Deutsch            |
            |    es     | Español (España)   |
            |    nl     | Nederlands         |
            |    pt     | Português          |
            |    fr     | Français           |
            |    da     | Dansk              |
            |    sv     | Svenska            |

            This parameter is **optional** and it defaults to **your configured
            language**.
        country:
          type: string
          example: us
          description: >-
            The desired country for the account. It is the `ISO 3166-1 alpha-2`
            code and the full range of countries is accepted.

            This parameter is **optional** and it defaults to **your configured
            country**.
        promo:
          type: string
          example: xmas-promo
          description: >-
            This is a free field you can use to "tag" accounts for promotional
            purposes.

            For example, you can tag accounts as `xmas-promo` as part of a
            Christmas promotion so that you can later filter how many accounts
            have been created as part of this promotion.

            However, since this is a **free field**, you can also use it to
            "tag" any internal code or ID you might need instead of
            promotional codes. For example, you can use `ABCD-1234` as `promo`
            in case you might need to link the account to some internal code.

            The `promo` field is limited to **100 characters** matching
            `[-_a-zA-Z0-9]{100}`.
        partner_token:
          type: string
          example: acme-cloud
          description: The partner token to link this account to
    AccountUpdateParameters:
      type: object
      properties:
        name:
          type: string
          example: John Doe
          description: The new name for the user
        email:
          type: string
          example: john@doe.com
          description: The new email for the user
        lang:
          type: string
          example: en
          description: The new language for the user
        country:
          type: string
          example: us
          description: The new country for the user
        promo:
          type: string
          example: xmas-promo
          description: The new desired promotional code
        partner_token:
          type: string
          example: acme-cloud
          description: The partner token to link this account to
    AccountUpgradeParameters:
      type: object
      required:
        - product
      properties:
        product:
          type: string
          example: evolution
          description: The product to upgrade / downgrade to
        force:
          type: boolean
          description: >-
            If the downgrade fails because new unmet requirements, use this
            parameters to force the downgrade. This can happen if the new
            product plan have more restrictive tiers, for example number
            of keywords allowed, and the currect plan have more than allowed
            resources. **Use with caution**: Forcing a downgrade will result
            in the excess of keywords / competitors / resources be deleted
            to meet the new requirements.
    ReportPostParameters:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          example: www.marketgoo.com
          description: The domain of the web site to check
        email:
          type: string
          example: john@doe.com
          description: >-
            The email of the user to send the report to. Leave blank (do not
            include it in the payload) if you don't want to send an email
            to the user.
        country:
          type: string
          example: us
          description: >-
            The desired target country for the report. It is the `ISO 3166-1
            alpha-2` code and the full range of countries is accepted.

            This parameter is **optional**. It defaults to **your default
            country** and will be replaced with the domain country TLD if
            there is one.

            For example, if you **do not provide** any country in the request
            and the domain is `great-britain.co.uk`, the country will be
            automatically assigned as `gb`, regardless of your default
            configured country.
        promo:
          type: string
          example: xmas-promo
          description: >-
            This is a free field you can use to "tag" reports for promotional
            purposes.

            For example, you can tag reports as `xmas-promo` as part of a
            Christmas promotion so that you can later filter how many reports
            have been created as part of this promotion.

            However, since this is a **free field**, you can also use it to
            "tag" any internal code or ID you might need instead of promotional
            codes. For example, you can use `ABCD-1234` as `promo` in case you
            might need to link the report to some internal code.

            The `promo` field is limited to **100 characters** matching
            `[-_a-zA-Z0-9]{100}`.
    ReportRequest:
      type: object
      properties:
        state:
          type: string
          example: starting
        title:
          type: string
          example: Report accepted for processing.
        percent-complete:
          type: number
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Administrative API Key. Required for all Provisioning API requests.
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Pre-signed JWT (HMAC-SHA256, signed with your API Key) granting scoped
        read access to a single account for Data API requests.
tags:
  - name: General information
    description: >-
      Branding configuration and the products / add-ons available to your
      integration.
  - name: Accounts
    description: >-
      Create, read, update, suspend, resume, delete and upgrade end-user
      accounts.
  - name: Account add-ons
    description: Manage product add-ons attached to an account.
  - name: Single Sign On
    description: Generate permanent or expiring Single Sign On links for end users.
  - name: SEO Reports
    description: Create and retrieve standalone SEO website reports.
servers:
  - url: https://app.acmeseo.com
    description: Example end-point. Replace the host with your assigned production domain.
security:
  - ApiKey: []
x-readme:
  explorer-enabled: false
