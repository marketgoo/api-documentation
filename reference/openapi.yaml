openapi: 3.0.3
info:
  title: marketgoo Provisioning and Data API
  version: 1.0.0
  description: >-
    The **marketgoo** API is based on REST principles and follows the
    recommendations from the [**json:api** specification](http://jsonapi.org).

    The API end-point uses the domain configured as part of your **marketgoo
    integration** with the `/api` prefix at the beginning of the path. We
    will use the domain `app.acmeseo.com/api` as an example end-point domain
    through this documentation, but remember to use your assigned production
    domain.

    The sections below apply both to the Provisioning API and the Data API. This
    is because the Data API is really a sub-set of the Provisioning API. You
    can read more information about the Data API in the **Data API features**
    section.

    # Content types and the json:api basics

    The **json:api** specification requires all data to be **JSON**. This means
    all returned entities and requests must be made as **JSON** objects. You
    are **required** to use the `Accept:` header with a mime type of
    `application/vnd.marketgoo.api+json` to be considered a valid **json:api**
    request.

    The `Content-Type` header is also required to be a mime type of
    `application/vnd.marketgoo.api+json`, but for the `Content-Type` header we
    also allow for you to use `application/json` if you find it difficult to
    override the standard **JSON** mime type of your library.

    # Authentication

    All calls to the **marketgoo** API must be SSL secured. Also, all
    provisioning API requests must be authenticated by using the `X-Auth-Token`
    header. You must use the provided **API Key** in this header.

    > ### Important note
    >
    > This **API Key** provides you with administrative privileges to freely
    > create, delete and manage accounts without restriction so it is very
    > important for your provision software to **keep this API Key as secured
    > as possible**.
    >
    > We will use `1234567890abcdef` as a dummy API Key through this
    > documentation.
    >
    > Please be sure to use our provided **API Key** in production.

    A sample request to the `/api/accounts` endpoint might look like:

    ```
    GET /api/accounts HTTP/1.1
    Host: app.acmeseo.com
    X-Auth-Token: 1234567890abcdef
    Accept: application/vnd.marketgoo.api+json
    ```

    # Pre-signed public Authentication

    There might be some times you will need to pre-authorize external libraries
    to access a certain account to read Data API information (see "Data API
    features" below). Some examples might include a WordPress Plugin, a cPanel
    host or some script you want to give Data API access **without exposing
    the private API Key**.

    The call to "Get single account" at `GET /api/account/<UUID>` (see below)
    accepts an `Authorization` header like in the following example:

    ```
    GET /api/accounts/<UUID> HTTP/1.1
    Host: app.acmeseo.com
    Authorization: Bearer <Pre-signed JWT Token>
    Accept: application/vnd.marketgoo.api+json
    ```

    The `<Pre-signed JWT Token>` bearer is similar in concept to an **OAuth2
    permanent token**. Your provision software can **sign this token using
    the API Key** and pass it along the `<UUID>` to the external software.
    Then this external software is free to store the token and use it in the
    `Authentication:` header to access the account information.

    JWT stands for "JSON Web Tokens", and it's a RFC 7519 standard for
    representing claims.

    Please see the [RFC-7519 standard](https://tools.ietf.org/html/rfc7519) and
    the [JWT website](https://jwt.io) for more information.

    To construct the JWT token needed for this authentication, please use the
    **HMACSHA256** algorithm to sign the JWT body using your **API Key** as
    secret. The body of the JWT needs to include the `uuid` field as shown
    below:

    ```
    {
        "uuid": <UUID>
    }
    ```

    There are several libraries to handle JWT tokens, please see the [JWT
    website](https://jwt.io) for more information. Here you can see an
    example using PHP with the Firebase JWT library:

    ```
    <?php

    // Use your preferred JWT library. Firebase used as example.
    use Firebase\JWT\JWT;

    // Pre-sign the JWT using your API Key with "HS256" algorithm
    $bearer = JWT::encode([
        "uuid" => "1cbd65c81e6462906c8f4eaf02417d3cae667ffb"
    ], "1234567890abcdef", "HS256");

    echo $bearer.PHP_EOL;

    ```

    The expected output should be like:

    ```
    eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1dWlkIjoiMWNiZDY1YzgxZTY0NjI5MDZjOGY0ZWFmMDI0MTdkM2NhZTY2N2ZmYiJ9.AslfPa8csfWO65asCfr79ErVgrrCPzeuG7LC1GH__vE
    ```
    Using the Bearer from the above example, you can make a request to `GET
    /api/accounts/<UUID>` as follows:

    ```
    GET /api/accounts/<UUID> HTTP/1.1
    Host: app.acmeseo.com
    Accept: application/vnd.marketgoo.api+json
    Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1dWlkIjoiMWNiZDY1YzgxZTY0NjI5MDZjOGY0ZWFmMDI0MTdkM2NhZTY2N2ZmYiJ9.AslfPa8csfWO65asCfr79ErVgrrCPzeuG7LC1GH__vE
    ```

    # Pagination

    Requests that may return several items are paginated. You can paginate by
    using the `page` object as specified in the [**json:api**
    specification](http://jsonapi.org/format/#fetching-pagination).

    Pages are specified by `page[limit]` and `page[offset]` parameters.
    `page[limit]` specifies how many items you want in each page. By default
    we return **100** items per page, with a upper limit of **1000** items.
    The `page[offset]` parameter specifies the first item to fetch. The
    **offset** is zero based, and it works pretty much like the `limit` /
    `offset` parameters of a SQL Query.

    For example, to get the first page of items where each page contains 10
    items you might use:

    `page[limit]=10 & page[offset]=0`

    To get the second page:

    `page[limit]=10 & page[offset]=10`

    To help you with pagination, each response of a paginated request contains a
    `meta` object holding meta data about the pagination and a `links` object
    containing links to the **next**, **previous**, **first** and **last** pages.

    Example `meta` and `links` object from a paginated response:

    ```
    {
        "data": [
            ...
        ],
        "meta": {
            "total_items": 100,
            "total_pages": 10
        },
        "links": {
            "first": "https://app.acmeseo.com/api/accounts?page[limit]=10&page[offset]=0",
            "last": "https://app.acmeseo.com/api/accounts?page[limit]=10&page[offset]=90",
            "prev": null,
            "next": "https://app.acmeseo.com/api/accounts?page[limit]=10&page[offset]=10"
        }
    }
    ```

    > **NOTE** The example query parameters above use unencoded `[` and `]`
    > characters simply for readability. In practice, these characters must be
    > percent-encoded, per the requirements in [RFC 3986](https://tools.ietf.org/html/rfc3986#section-3.4).

    ## Filtering by domain

    In addition to pagination parameters, you can filter accounts by domain
    using the `filter[domain]` parameter. This allows you to search for accounts
    associated with a specific domain.

    For example, to filter accounts by domain:

    `filter[domain]=www.test.com`

    The domain filter performs an exact match, meaning that `www.test.com` and
    `test.com` will yield different results. Note that even when filtering by a
    specific domain, the endpoint returns a collection of results, not
    necessarily a single account.

    Example of a request with domain filtering:

    ```
    GET /api/accounts?filter[domain]=www.test.com HTTP/1.1
    Host: app.acmeseo.com
    X-Auth-Token: 1234567890abcdef
    Accept: application/vnd.marketgoo.api+json
    Content-Type: application/json
    ```

    # Product and product add-on tokens

    The list of available products and add-ons will vary upon your partnership
    contract with marketgoo. We use the example product token `evolution` and
    an example add-on token `keyword10` only for documentation purposes. You
    can view your actual list of available product and add-on tokens by using
    the "**General information**" operations "**Get available products**" and
    "**Get available product add-ons**" in the reference below.

paths:
  /api/me:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: mktgoo
                        description: The unique ID for the branding
                      type:
                        type: string
                        example: branding
                        description: Type of the object returned in `attributes`.
                      attributes:
                        $ref: '#/components/schemas/BrandingInfo'
              example:
                data:
                  id: mktgoo
                  type: branding
                  attributes:
                    branding: mktgoo
                    tag: marketgoo
                    domain: apps.marketgoo.com
                    name: marketgoo
                    company: MarketGoo Internet, S.L.
                    website: https://www.marketgoo.com
                    lang: en
                    country: us
        '403':
          description: Forbidden
          headers: {}
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemError'
              example:
                errors:
                  - status: 403
                    title: Forbidden
      summary: Branding configuration
      operationId: brandingConfiguration
      description: Returns your current branding configuration
      tags:
        - General information
  /api/me/products:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductJson'
              example:
                data:
                  - id: evolution
                    type: product
                    attributes:
                      key: evolution
                      name: Evolution
                      trial_period: 10
                      base_price: 29.9
                      currency: EUR
                      features:
                        is_pack: false
                        max_plans: 5
                        max_keywords: 20
                        max_competitors: 4
                        max_pages: 1000
                        scan_interval: 1
        '403':
          description: Forbidden
          headers: {}
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemError'
              example:
                errors:
                  - status: 403
                    title: Forbidden
      summary: Get available products
      operationId: getAvailableProducts
      description: ''
      tags:
        - General information
  /api/me/addons:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonJson'
              example:
                data:
                  - id: keyword10
                    type: addon
                    attributes:
                      token: keyword10
                      name: Additional 10 keyword package
                      base_price: 0.01
        '403':
          description: Forbidden
          headers: {}
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemError'
              example:
                errors:
                  - status: 403
                    title: Forbidden
      summary: Get available product add-ons
      operationId: getAvailableProductAddOns
      description: ''
      tags:
        - General information
  /api/accounts/{uuid}:
    get:
      responses:
        '200':
          description: OK
          content:
            application/vnd.marketgoo.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountJson'
              example:
                data:
                  type: account
                  id: c3c0d4d62c685480ae197aae9e39d6cf1859c66c
