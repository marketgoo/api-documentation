components:
  schemas:
    BrandingInfo:
      type: object
      properties:
        branding:
          type: string
          example: mktgoo
          description: The unique ID for your branding
        tag:
          type: string
          example: marketgoo
          description: Internal name for your branding. This not shown to the customers
        domain:
          type: string
          example: apps.marketgoo.com
          description: Your configured production domain
        name:
          type: string
          example: marketgoo
          description: >-
            The global branded name of the application. This may be shown to
            your customers as the name of the service in several places of
            the application. For instance, some sentences shown in the UI
            may use this name like _`Welcome to marketgoo!`_.
        company:
          type: string
          example: MarketGoo Internet, S.L.
          description: >-
            The name of your company. This may be shown to your customers as the
            name of the company offering the service. For instance, some
            sentences shown in the UI may use this company name like:
              _`marketgoo is a service of MarketGoo Internet, S.L.`_.
        website:
          type: string
          example: https://www.marketgoo.com
          description: The public URL for your corporate website.
        lang:
          type: string
          example: en
          description: >-
            The default language for your customers. This language setting will
            be used as the default language for new accounts. It is the
            `ISO 639-1` language code and currently it is limited to the
            following available languages:

            | ISO 639-1 | Language           |
            |:----------|:-------------------|
            |    en     | English (American) |
            |    gb     | English (British)  |
            |    de     | Deutsch            |
            |    es     | Español (España)   |
            |    nl     | Nederlands         |
            |    pt     | Português          |
            |    fr     | Français           |
            |    da     | Dansk              |
            |    sv     | Svenska            |
        country:
          type: string
          example: us
          description: >-
            The default country for your customers. This country setting will be
            used as the default country for new accounts. It is the
            `ISO 3166-1 alpha-2` code and the full range of countries is
            accepted.
    ProductFeatures:
      type: object
      properties:
